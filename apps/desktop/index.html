<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-BIM</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <span class="brand">Open-BIM</span>
      <div class="group">
        <button data-cmd="new" title="New project (Ctrl+N)">New</button>
        <button data-cmd="open" title="Open (Ctrl+O)">Open</button>
        <button data-cmd="save" title="Save (Ctrl+S)">Save</button>
        <button data-cmd="exportPdf" title="Export all sheets to one vector PDF">Export PDF</button>
        <button data-cmd="importIfc" title="Import an IFC file (as direct shapes on matching levels)">Import IFC</button>
        <button data-cmd="exportIfc" title="Export the model as IFC4">Export IFC</button>
        <button data-cmd="importDxf" title="Import DXF line work into this view">Import DXF</button>
        <button data-cmd="exportDxf" title="Export this view or sheet as DXF">Export DXF</button>
      </div>
      <div class="group">
        <button data-cmd="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button data-cmd="redo" title="Redo (Ctrl+Y)">Redo</button>
      </div>
      <div class="group">
        <button data-tool="select" class="active" title="Select (Esc)">Select</button>
        <button data-tool="refplane" title="Reference plane (R)">Ref Plane</button>
      </div>
      <div class="group family-only">
        <span id="family-banner" class="banner">Family</span>
        <button data-tool="extrusion" title="Extrusion: sketch a profile (plan = XY, Front = XZ, Right = YZ), Enter">Extrusion</button>
        <button data-tool="blend" title="Blend: sketch the bottom loop, then the top loop, Enter">Blend</button>
        <button data-tool="revolution" title="Revolve: sketch a profile in an elevation; it turns about the centre line">Revolve</button>
        <button data-tool="sweep" title="Sweep: click a path in plan, Enter">Sweep</button>
        <button data-tool="component" title="Place a nested family (C)">Component</button>
        <label title="New forms are voids (cut the solids)"><input type="checkbox" id="void-form" /> Void</label>
        <button data-cmd="saveFamilyFile" title="Save this family as an open .obim-family file">Save Family File</button>
        <button data-cmd="loadFamily" class="primary" title="Load this family into the project and close the editor">Load into Project</button>
        <button data-cmd="closeFamily" title="Close the family without loading it">Close Family</button>
      </div>
      <div class="group project-only">
        <button data-tool="wall" title="Wall (W)">Wall</button>
        <button data-tool="grid" title="Grid (G)">Grid</button>
        <button data-tool="floor" title="Floor: sketch boundary">Floor</button>
        <button data-tool="ceiling" title="Ceiling: sketch boundary">Ceiling</button>
        <button data-tool="roof" title="Roof by footprint: sketch boundary">Roof</button>
        <button data-tool="door" title="Door: click a wall (D)">Door</button>
        <button data-tool="window" title="Window: click a wall (N)">Window</button>
        <button data-tool="opening" title="Wall opening: click a wall">Opening</button>
        <button data-tool="component" title="Component: place a loaded family (C)">Component</button>
        <button data-cmd="group" title="Group the selection (Ctrl+G)">Group</button>
      </div>
      <div class="group project-only">
        <button data-tool="room" title="Room: click inside walls (plans)">Room</button>
        <button data-tool="roomseparator" title="Room separator: bounds rooms where there's no wall">Separator</button>
        <button data-tool="area" title="Area: click inside area boundaries (area plans)">Area</button>
        <button data-tool="areaboundary" title="Area boundary line (area plans)">Area Boundary</button>
      </div>
      <div class="group project-only">
        <button data-tool="section" title="Section: click head, then tail; looks to the left (S)">Section</button>
        <button data-cmd="elevations" title="Create North/East/South/West elevations around the model">Elevations</button>
        <button data-tool="callout" title="Callout: click two corners on a floor plan">Callout</button>
      </div>
      <div class="group project-only">
        <button data-tool="dimension" title="Aligned dimension: pick walls/grids, then place (M)">Dimension</button>
        <button data-tool="detailline" title="Detail line, this view only (L)">Detail Line</button>
        <button data-tool="region" title="Filled region: sketch a boundary">Region</button>
        <button data-tool="text" title="Text note (T)">Text</button>
        <button data-tool="tag" title="Tag by category: click an element">Tag</button>
        <button data-tool="cloud" title="Revision cloud: sketch around a change (latest open revision)">Cloud</button>
        <button data-tool="keynote" title="Keynote tag: click an element (its keynote, or its type's / material's)">Keynote</button>
      </div>
      <div class="group">
        <label>Level <select id="active-level"></select></label>
        <label><span id="active-type-label">Type</span> <select id="active-type"></select></label>
      </div>
      <div class="group">
        <button data-view="plan" title="Floor plan of the active level">Plan</button>
        <button data-view="3d" class="active" title="3D view">3D</button>
        <button data-cmd="fit" title="Zoom to fit (F)">Fit</button>
      </div>
      <div class="group">
        <button data-cmd="hide" title="Temporarily hide selection (H); Shift = whole category (Shift+H)">Hide</button>
        <button data-cmd="isolate" title="Temporarily isolate selection (I); Shift = whole category (Shift+I)">Isolate</button>
        <button data-cmd="resetVisibility" title="Reset temporary hide/isolate (U)">Reset</button>
        <button data-cmd="console" title="Scripting console and plugins (`)">Console</button>
      </div>
    </header>
    <main>
      <aside id="browser">
        <h2>Project Browser</h2>
        <div id="browser-body"></div>
      </aside>
      <div id="viewport"><div id="schedule-pane" hidden></div><div id="console" hidden></div></div>
      <aside id="properties">
        <h2>Properties</h2>
        <div id="properties-body"></div>
      </aside>
    </main>
    <footer id="status">Ready</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
