<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-BIM</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="ribbon"></header>
    <div id="options-bar">
      <span id="family-banner" class="banner family-only"></span>
      <label>Level <select id="active-level"></select></label>
      <label><span id="active-type-label">Type</span> <select id="active-type"></select></label>
    </div>
    <main>
      <aside id="browser">
        <h2>Project Browser</h2>
        <div id="browser-body"></div>
      </aside>
      <div id="view-area"><div id="panes"></div><div id="viewport"><div id="tool-options" hidden></div><div id="schedule-pane" hidden></div><div id="console" hidden></div><div id="clash-pane" hidden></div><div id="collab-pane" hidden></div><div id="nz-pane" hidden></div></div>
        <div id="view-tabs"></div>
        <div id="view-bar"></div>
      </div>
      <aside id="properties">
        <h2>Properties</h2>
        <div id="properties-body"></div>
      </aside>
    </main>
    <footer id="statusbar"><span id="status">Ready</span><button id="sel-filter" hidden title="Filter the selection by category"></button></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
