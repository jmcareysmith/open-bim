[package]
name = "open-bim"
version = "0.1.0"
description = "Open-source BIM authoring"
edition = "2021"
license = "MIT"

[lib]
name = "open_bim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
